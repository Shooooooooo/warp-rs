name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # For the advisory job below, which has nothing to do with a push: a
  # dependency tree is pinned by a committed lock file and `--locked`
  # everywhere, so nothing in it will ever move on its own and an advisory
  # published against any of the 41 crates would sit there indefinitely with a
  # green tick above it. The only thing that changes between runs is the
  # database.
  schedule:
    - cron: "0 7 * * 1"

env:
  CARGO_TERM_COLOR: always

# Read-only by default, for every job. GitHub hands a job the repository's
# default token scope when a workflow says nothing, and nothing here needs to
# write: these jobs build, test and lint. It is one line and it is the mitigation
# that does not depend on trusting an action — the `msrv` job below runs
# `dtolnay/rust-toolchain@master`, a mutable branch reference rather than a
# commit, and so do the `actions/*` majors, so what any of them can do if one
# day it is not what it was is bounded here rather than there.
permissions:
  contents: read

jobs:
  # The renderer's whole job is to behave the same across terminals and
  # platforms, so the test matrix is the point rather than a formality.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Default features first: `snapshot` is optional, and the build without
      # it is the one people actually install. There was a `cargo build
      # --locked` above this line for a while, which bought nothing — `cargo
      # test` compiles the bin targets too, so it was a second full compile of
      # the same tree on each of three operating systems.
      - run: cargo test --locked
      - run: cargo test --locked --all-features

  lint:
    name: clippy and rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-clippy-

      # Formatting first: it needs no build, so a misformatted branch says so
      # in seconds rather than after clippy has compiled the dependency tree.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # `exclude` in Cargo.toml is hand-maintained, and the failure mode is
      # quiet: a crate that builds here and not from the tarball anyone
      # installs. `cargo package` assembles the package and builds it, which is
      # the check. The `--list` before it prints what went in, so a diff that
      # drops a file says which one in the log rather than in a build error.
      - run: cargo package --locked --list
      - run: cargo package --locked

      # The cheapest mechanical guard there is on the prose, which is otherwise
      # the one thing in this tree nothing checks. `docs.rs` builds this crate
      # with all features on purpose, and rustdoc's own complaints are the only
      # warning anybody gets that a published page has gone wrong: sixteen had
      # accumulated, fifteen of them public documentation pointing at private
      # items — which renders as plain text rather than as a link — and one a
      # reference to `models::attitude` that resolved to nothing at all.
      #
      # `--no-deps` because the dependencies' documentation is their business,
      # and `-D warnings` for the same reason clippy takes it: a warning nobody
      # is required to read is a warning that accumulates.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --all-features --no-deps

  # `rust-version` in Cargo.toml is a promise to anyone on an older toolchain,
  # and an untested promise is a guess. Checking rather than testing: this is
  # about whether the crate and its locked dependencies still compile there,
  # and the behaviour they compile into is what the matrix above is for.
  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml has no rust-version to check against"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-msrv-${{ steps.msrv.outputs.version }}-

      - run: cargo check --locked --all-targets --all-features

  # Nothing in this repository will otherwise ever report a vulnerability
  # against the dependency tree, which is a direct consequence of pinning it:
  # `Cargo.lock` is committed and every cargo invocation above passes
  # `--locked`, so the tree cannot drift into a fix any more than it can drift
  # into a break. The point is the notification, not an automatic update — an
  # update would fight the lock file on purpose.
  #
  # Not on pull requests: it takes a few minutes to build the auditor and it
  # says nothing about a diff. On the schedule, on a push to main, and by hand.
  audit:
    name: security advisories
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # `--headless` renders on a fixed timestep with no terminal control, so a
  # fixed seed has to produce the same bytes every time. That is what makes it
  # possible to tell whether a change to the renderer changed only what was
  # meant — worth guarding, since it is easy to break without noticing.
  headless:
    name: headless output is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-release-

      - run: cargo build --release --locked --all-features

      # The one invocation in this file that does not pass `--color`, and it is
      # left off deliberately rather than forgotten: every step below spells the
      # mode out, so without this nothing anywhere runs the binary the way a
      # person does. The checks are comparative — one seed twice, then another —
      # so whatever the default is cannot turn it red. It used to hash the ascii
      # writer here, since a runner sets no `TERM` and `--color` detected one;
      # it hashes the truecolor writer now, which is the path almost everyone
      # is actually on.
      - name: the same seed produces the same flight
        run: |
          fly() {
            ./target/release/warp --headless --frames 120 --seed "$1" \
              --size 120x36 --demo | sha256sum | cut -d' ' -f1
          }
          a=$(fly 1); b=$(fly 1); c=$(fly 2)
          echo "seed 1, first run:  $a"
          echo "seed 1, second run: $b"
          echo "seed 2:             $c"
          if [ "$a" != "$b" ]; then
            echo "::error::a seeded flight is no longer reproducible"
            exit 1
          fi
          if [ "$a" = "$c" ]; then
            echo "::error::two different seeds produced the same sky"
            exit 1
          fi

      # Repeatable is not the same as unchanged: a renderer that draws every
      # frame differently is still perfectly repeatable about it. This pins the
      # bytes themselves, so an edit that was meant to touch one thing and
      # touched the whole sky has to say so.
      #
      # `cargo test --test golden` checks these same hashes in process, which is
      # what makes a drifted renderer fail on the machine that drifted it rather
      # than minutes later up here. This runs the release binary against the same
      # file, so between them the two also prove they agree — a library that
      # renders one thing and a binary another would be a bug of its own.
      - name: the frames are the ones committed as the reference
        run: |
          common="--headless --frames 120 --seed 1 --size 120x36"
          ./target/release/warp $common --demo --color truecolor > truecolor.txt
          ./target/release/warp $common --demo --color ascii     > ascii.txt
          ./target/release/warp $common --demo --color 256       > ansi256.txt
          ./target/release/warp $common --engage --throttle 1.0 --color truecolor > warp.txt
          ./target/release/warp $common --engage --throttle 1.0 --view side --color truecolor > side.txt
          ./target/release/warp $common --engage --throttle 1.0 --view side --orbit 55,35,20 --color truecolor > orbit.txt
          ./target/release/warp $common --engage --throttle 1.0 --view side --orbit -75,6,20 --color truecolor > astern.txt
          ./target/release/warp $common --demo --fps 10 --color truecolor > steer.txt
          ./target/release/warp $common --demo --fps 10 --view side --orbit -60,0,0 --color truecolor > drift.txt
          ./target/release/warp $common --engage --throttle 1.0 --fps 10 --view side --orbit 90,0,0 --color truecolor > ahead.txt
          if ! sha256sum -c tests/golden/frames.sha256; then
            echo "::error::the frames no longer match tests/golden/frames.sha256; if that was the point of the change, regenerate it with the recipe in that file"
            exit 1
          fi

      # The mode exists for terminals that cannot be sent colour, and such a
      # terminal is generally not one to send U+2588 to either.
      # Documentation that can be run is worth keeping runnable, and these
      # three lines are the ones a maintainer reaches for at exactly the moment
      # the notes insist on measuring rather than guessing. They aborted for a
      # while: the third argument became a limiting magnitude when the sky did,
      # and every recipe in `bench.rs` and `CLAUDE.md` went on passing a star
      # count. Run once each, for the exit status rather than the numbers —
      # a timing on a shared runner is not worth reading.
      - name: the documented benchmark recipes still run
        run: |
          cargo build --release --locked --examples
          ./target/release/examples/bench 200 60 8 > /dev/null
          ./target/release/examples/bench 200 60 8 side 256 > /dev/null
          ./target/release/examples/bench 200 60 8 side truecolor > /dev/null

      # A terminal is what interactive mode needs and what a pipeline has not
      # got, and this is the sentence somebody meets first if they leave
      # `--headless` off. Checked here rather than in a unit test for the same
      # reason the closed pipe below is: what is under test is the process's own
      # exit status against a real file descriptor.
      - name: a flight without a terminal says which flag was wanted
        run: |
          set +e
          message=$(./target/release/warp --demo 1 --size 60x20 2>&1 >/dev/null </dev/null)
          status=$?
          set -e
          if [ "$status" = "0" ]; then
            echo "::error::warp took over a terminal it has not got"
            exit 1
          fi
          case "$message" in
            *--headless*) ;;
            *) echo "::error::the refusal does not name the flag that would have worked: $message"; exit 1 ;;
          esac

      - name: ascii mode really is ascii
        run: |
          if LC_ALL=C grep -qP '[^\x20-\x7e\n]' ascii.txt; then
            echo "::error::--color ascii emitted bytes outside printable ascii"
            LC_ALL=C grep -nP '[^\x20-\x7e\n]' ascii.txt | head -5
            exit 1
          fi

      # `--headless` exists to be read by something else, so being read by
      # something that stops early is the ordinary case rather than a fault.
      # Rust ignores `SIGPIPE`, so the write returns an error instead of ending
      # the process, and that error used to travel all the way out to `main`
      # and print `warp: Broken pipe (os error 32)` on the way to exit 1.
      #
      # Checked here rather than in a unit test because what is under test is
      # the process's own exit status against a pipe a shell built, and there
      # is no honest way to ask that question from inside the library.
      - name: a closed pipe is not an error
        run: |
          # stdout into a pipe `head` abandons after 50 bytes, stderr into a
          # file so it can be read back. 500 frames of 120x36 truecolor is
          # megabytes, so the pipe buffer is long gone by the time head exits
          # and the write really does come back EPIPE.
          err=$(mktemp)
          ./target/release/warp --headless --frames 500 --seed 1 \
            --size 120x36 --demo --color truecolor 2>"$err" | head -c 50 >/dev/null
          status=${PIPESTATUS[0]}
          if [ -s "$err" ]; then
            echo "::error::warp complained when its reader went away: $(cat "$err")"
            exit 1
          fi
          if [ "$status" != "0" ]; then
            echo "::error::warp exited $status when its reader went away"
            exit 1
          fi

      - name: a snapshot can still be written
        run: |
          ./target/release/warp --snapshot frame.png --engage --throttle 1.0 \
            --warmup 120 --scale 1 --seed 1 --size 120x36
          test -s frame.png

      # The README's front page, checked the way the reference frames are. Those
      # two images are the first thing anybody sees of this program and nothing
      # pinned them: CLAUDE.md's own note said a reshoot is checked by looking
      # at it, which is how the hero came to advertise twice the sky a default
      # run draws for the whole life of the renderer before anyone thought to
      # compare. The bytes turn out to be exactly reproducible from the recipes
      # written down beside them — same Linux-only caveat as the text frames,
      # and the same `--locked` pinning the PNG encoder — so they can simply be
      # hashed.
      #
      # A moved hash here means the sky has changed and the front page has not.
      # That is a reshoot to be looked at and committed, not a build to be
      # fixed: run the two commands in CLAUDE.md and put the new files in
      # `docs/`.
      - name: the screenshots are the sky the renderer draws
        run: |
          common="--engage --throttle 1.0 --warmup 600 --scale 2"
          ./target/release/warp --snapshot shot-warp.png   $common --seed 6
          ./target/release/warp --snapshot shot-astern.png $common --view side --orbit 245,30,0 --seed 8
          for pair in "shot-warp.png docs/warp.png" "shot-astern.png docs/astern.png"; do
            set -- $pair
            fresh=$(sha256sum "$1" | cut -d' ' -f1)
            shipped=$(sha256sum "$2" | cut -d' ' -f1)
            if [ "$fresh" != "$shipped" ]; then
              echo "::error::$2 is not what the renderer draws any more; reshoot it with the recipe in CLAUDE.md"
              echo "  shipped $shipped"
              echo "  fresh   $fresh"
              exit 1
            fi
          done
