[package]
name = "warp-rs"
version = "0.1.0"
edition = "2021"
description = "Fly a starship through the universe at warp in your terminal"
license = "MIT"
repository = "https://github.com/Shooooooooo/warp-rs"
readme = "README.md"
keywords = ["terminal", "starfield", "screensaver", "tui", "warp"]
categories = ["command-line-utilities", "visualization"]
# The floor the dependency tree imposes, and not a number this crate is free to
# lower: on 1.84 a transitive manifest will not even parse. The `msrv` CI job
# reads this field and `cargo check`s the crate and its locked dependencies
# against exactly it, so this is a tested guarantee rather than a claim about
# them, and moving the floor means editing it here on purpose.
rust-version = "1.85"
# Screenshots, CI config and the contributor notes are for the repository, not
# for the published crate. The README links its images by absolute URL because
# of this line: docs.rs renders that file out of the package, where a relative
# `docs/` path points at nothing. `CLAUDE.md` is here on the same principle:
# forty-odd kilobytes of notes addressed to whoever is editing the tree, which
# is nobody who has the crate as a dependency.
exclude = ["docs/", ".github/", "CLAUDE.md"]

# docs.rs builds with default features, and `snapshot` is not one of them — so
# without this the `snapshot` module is simply absent from the published
# documentation, while `README.md` on the same page goes on describing how to
# use it. The feature is the only thing gated, so there is nothing to be gained
# by naming it rather than asking for all of them.
[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "warp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
# Two of crossterm's four default features are dead weight here, and the rule
# above about not adding a dependency is worth nothing if the ones already
# present are taken with whatever they ship switched on. `bracketed-paste` gates
# an event nothing reads. `derive-more` exists for `Display` impls on `KeyCode`
# and `Event` that nothing here formats, and it alone pulls `derive_more`,
# `derive_more-impl`, `convert_case`, `unicode-segmentation`, `rustc_version`,
# `semver` and a second copy of `syn` — a whole proc-macro stack, for prose no
# frame contains. What is left is what is used: `events` for `event::poll` and
# `read`, `windows` for `ansi_support` and the Windows leg of the CI matrix.
crossterm = { version = "0.29", default-features = false, features = [
    "events",
    "windows",
] }
# Likewise: the only RNG this tree builds is `StdRng::seed_from_u64`, and every
# seed it is given comes from `--seed` or from the clock. There is no
# `thread_rng`, no `OsRng`, no `rand::random` anywhere, so the two features that
# exist to seed from the operating system carry `getrandom` and `r-efi` in for
# nothing. `std_rng` is what keeps `StdRng`, and it is chacha20-backed either
# way — the reference frames do not move for this.
rand = { version = "0.10", default-features = false, features = [
    "std",
    "std_rng",
] }
png = { version = "0.18", optional = true }

# The one place the rule above bends, and it bends without costing anything.
# A process killed by a signal runs no `Drop`, so `RawGuard` never fires and
# whoever sent it gets their terminal back in raw mode on the alternate screen
# with no cursor and no prompt — which is exactly what happens to a screensaver
# when the pane it was dropped into goes away. Answering that needs a signal
# handler and `std` has none, so it is this or nothing.
#
# It widens the manifest and not the tree: `crossterm`'s `events` feature
# already carries `signal-hook` for SIGWINCH, so this names a crate that was
# being compiled anyway. `cargo tree --locked -e normal` counts 41 crates
# before this line and 41 after. Unix only, because that is where the signals
# are; on Windows `interrupted` is a function that returns false.
#
# `default-features = false` for the same reason the two above take it: the
# `channel` and `iterator` modules are a whole way of consuming signals that
# nothing here calls, where `flag` and `consts` are outside the feature gates.
# `flag::register` is also why this is the crate rather than the
# `signal-hook-registry` beneath it — it installs the handler that stores
# `true` into an `AtomicBool`, which is the entire handler this wants, and it
# is safe where registering by hand is not.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", default-features = false }

[features]
default = []
snapshot = ["dep:png"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
